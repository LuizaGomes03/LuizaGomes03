name: Gerar cobrinha

on:
  schedule:
    - cron: "0 */12 * * *"   # atualiza a cada 12 horas
  workflow_dispatch:          # permite rodar manualmente na aba Actions
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gerar SVGs da cobrinha (tons de marrom)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#7F5539&color_dots=#ebedf0,#e6ccb2,#ddb892,#b08968,#7f5539
            dist/github-contribution-grid-snake-dark.svg?color_snake=#DDB892&color_dots=#161b22,#5e3b24,#7f5539,#a0673d,#ddb892

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
